<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="jev-certify: certified decision thresholds for Jev"><rect width="1600" height="900" fill="#0A0F1C"/><circle cx="1320" cy="-60" r="440" fill="#60A5FA" opacity="0.07"/><circle cx="180" cy="960" r="420" fill="#4ADE80" opacity="0.06"/><text x="80" y="84" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#4ADE80" text-anchor="start" letter-spacing="2.2">JEV 1.13  ·  TYPESAFE SYSTEM ONE</text><text x="1520" y="84" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#64748B" text-anchor="end" letter-spacing="1.6">2,412 DECISIONS  ·  $0.23  ·  HUMAN LABELS</text><text x="80" y="232" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#F8FAFC" text-anchor="start">Jev gives you a calibrated probability.</text><text x="80" y="306" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#60A5FA" text-anchor="start">This turns it into a certificate.</text><text x="80" y="366" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#94A3B8" text-anchor="start">Conformal risk control + prediction-powered inference, measured on a 150-way intent router.</text><rect x="80.0" y="424" width="452.0" height="216" fill="#121A2B" stroke="#1E293B" rx="16"/><rect x="80.0" y="424" width="4" height="216" fill="#4ADE80" rx="2"/><text x="114" y="502" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#4ADE80" text-anchor="start">84.75%</text><text x="114" y="542" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#F8FAFC" text-anchor="start">of traffic auto-routed at a 5% risk target</text><text x="114" y="572" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">2.65% wrong among routed · certificate holds</text><text x="114" y="596" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">(0.0225 measured vs 0.0499 certified)</text><rect x="574.0" y="424" width="452.0" height="216" fill="#121A2B" stroke="#1E293B" rx="16"/><rect x="574.0" y="424" width="4" height="216" fill="#FBBF24" rx="2"/><text x="608" y="502" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#FBBF24" text-anchor="start">1.95%</text><text x="608" y="542" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#F8FAFC" text-anchor="start">is the floor on risk for this model</text><text x="608" y="572" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">α = 1% is unreachable: 56.4% of answers come</text><text x="608" y="596" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">back exactly 1.0, and 9 of those are wrong</text><rect x="1068.0" y="424" width="452.0" height="216" fill="#121A2B" stroke="#1E293B" rx="16"/><rect x="1068.0" y="424" width="4" height="216" fill="#60A5FA" rx="2"/><text x="1102" y="502" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#60A5FA" text-anchor="start">40 / 254</text><text x="1102" y="542" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#F8FAFC" text-anchor="start">hand labels to audit it</text><text x="1102" y="572" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">40 labels with Jev's estimates do what 254</text><text x="1102" y="596" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">labels do without — a 62% narrower interval</text><rect x="80" y="672" width="720" height="176" fill="#121A2B" stroke="#1E293B" rx="14"/><line x1="142" y1="802.0" x2="770" y2="802.0" stroke="#1B2438" stroke-width="1"/><text x="134" y="807" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="end">0.002</text><line x1="142" y1="774.0" x2="770" y2="774.0" stroke="#1B2438" stroke-width="1"/><text x="134" y="779" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="end">0.01</text><line x1="142" y1="746.0" x2="770" y2="746.0" stroke="#1B2438" stroke-width="1"/><text x="134" y="751" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="end">0.05</text><text x="212" y="840" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle">0.6</text><text x="491" y="840" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle">0.8</text><text x="770" y="840" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle">1</text><path d="M770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,740.2 L770.0,