ext><text x="856" y="812" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#FBBF24" text-anchor="start">It also measures where the guarantee breaks:</text><text x="856" y="838" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#64748B" text-anchor="start">prevalence shift 3.6× over the bound, and 1.0000 loss/query on shifted traffic.</text></svg>
