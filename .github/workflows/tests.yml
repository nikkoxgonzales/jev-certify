name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The package is intentionally dependency-free: the whole HTTP stack is urllib, and
      # the statistics are hand-rolled. Only the test runner comes from the dev extra, so
      # this also checks that the runtime dependency list is genuinely empty.
      - name: Install
        run: pip install -e ".[dev]"

      # No API key and no network: every test either simulates data or replays the
      # committed journal, and the replay path is hash-checked, so a passing run is
      # evidence the recorded results still reproduce.
      # addopts is cleared so the runner prints the pass count and timings that the badge
      # and the README claim, instead of a bare exit code.
      - name: Tests
        run: python -m pytest tests -o addopts="" -q --durations=6

      - name: Re-analyse the committed run (must not call the API)
        run: python -m experiments.analyse
